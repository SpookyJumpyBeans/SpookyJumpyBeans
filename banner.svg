      <stop offset="0%" stop-color="#0b1020"/><stop offset="55%" stop-color="#12182b"/><stop offset="100%" stop-color="#1a1630"/>
    </linearGradient>
    <linearGradient id="c-uva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/><stop offset="100%" stop-color="#E57200"/>
    </linearGradient>
    <filter id="c-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="240" rx="18" fill="url(#c-bg)"/>
  <defs>
    <pattern id="c-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#1b2338" stroke-width="1"/>
