    </pattern>
    <radialGradient id="c-fade" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#0b1020" stop-opacity="0"/><stop offset="100%" stop-color="#0b1020" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="c-sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
