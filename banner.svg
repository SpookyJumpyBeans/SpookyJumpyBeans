      <stop offset="45%" stop-color="#ffb347" stop-opacity="1"/>
      <stop offset="55%" stop-color="#E57200" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3d5a99" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c-card"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>
