<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Boyi Dai. Computer Engineering student at UVA. Interested in systems, infrastructure, and compilers.">
  <title>Boyi Dai</title>
  <desc>Boyi Dai. Computer Engineering student at UVA. Interested in systems, infrastructure, and compilers.</desc>
  <defs>
