<svg xmlns="http://www.w3.org/2000/svg" width="440" height="206" viewBox="0 0 440 206" role="img" aria-label="toy-cpu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#1a1630"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d2b8ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="440" height="206" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="438" height="204" rx="15" fill="none" stroke="#2a3348" stroke-width="1.5"/>
  <rect x="0" y="22" width="6" height="162" rx="3" fill="url(#accent)"/>
  <circle cx="400" cy="30" r="46" fill="#a371f7" opacity="0.07"/>
  <text x="28" y="38" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2.6" fill="#8b93a7">COMPUTER ARCHITECTURE</text>
  <rect x="332" y="22" width="84" height="22" rx="11" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7" stroke-opacity="0.7"/><circle cx="345" cy="33" r="3.5" fill="#d2b8ff"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="354" y="37" font-family="Cascadia Code, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10.5" fill="#d2b8ff">LIVE DEMO</text>
  <text x="28" y="74" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f7ff">toy-cpu</text>
  <rect x="28" y="84" width="44" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="28" y="110" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3cad8">8-bit multi-cycle CPU in structural VHDL with hardwired</text>
  <text x="28" y="131" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3cad8">control and a 14-instruction ISA. Fits in 73 ALMs on a</text>
  <text x="28" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3cad8">Cyclone V FPGA.</text>
  <rect x="28" y="168" width="49" height="22" rx="11" fill="#8e6cc0" fill-opacity="0.16" stroke="#8e6cc0" stroke-opacity="0.55"/><circle cx="39" cy="179" r="3.2" fill="#8e6cc0"/><text x="47" y="183" font-family="Cascadia Code, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" fill="#e6edf3">VHDL</text>
  <rect x="85" y="168" width="90" height="22" rx="11" fill="#F7DF1E" fill-opacity="0.16" stroke="#F7DF1E" stroke-opacity="0.55"/><circle cx="96" cy="179" r="3.2" fill="#F7DF1E"/><text x="104" y="183" font-family="Cascadia Code, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" fill="#e6edf3">JavaScript</text>
  <rect x="183" y="168" width="49" height="22" rx="11" fill="#0071C5" fill-opacity="0.16" stroke="#0071C5" stroke-opacity="0.55"/><circle cx="194" cy="179" r="3.2" fill="#0071C5"/><text x="202" y="183" font-family="Cascadia Code, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" fill="#e6edf3">FPGA</text>
